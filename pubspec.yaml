name: mysiklus
description: "Asisten Pencatatan Masa Suci dan Temu Kembali Panduan Fiqh Darah Wanita"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend as a Service (Database, Auth, Storage)
  supabase_flutter: ^2.5.6

  # UI & Calendar
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Utilities & Local Persistence
  shared_preferences: ^2.5.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
